<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pit Lane Dealer — Motorsport Trading Empire</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070e;--surface:#0f0f1a;--panel:#161625;--panel-h:#1e1e32;--border:#252540;--border-h:#3a3a60;--text:#e2e4f0;--dim:#7880a0;--muted:#3a3d55;--formula:#e63946;--endurance:#4895ef;--rally:#57cc99;--touring:#ff9500;--drag:#ffd60a;--gt:#9b5de5;--success:#57cc99;--warn:#ff9500;--danger:#e63946;--info:#4895ef;--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;--font-h:'Rajdhani',sans-serif;--font-m:'JetBrains Mono',monospace;--font-b:'Inter',sans-serif;--hdr:58px;--nav:172px;--ticker:36px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px;overflow:hidden;height:100vh}
button{cursor:pointer;border:none;font-family:inherit;transition:all .15s}
input{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:3px}

/* HEADER */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:100}
#logo{font-family:var(--font-h);font-size:18px;font-weight:700;letter-spacing:2px;background:linear-gradient(135deg,var(--formula),var(--drag));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.15;white-space:nowrap}
.hsep{width:1px;height:30px;background:var(--border)}
.hstat{display:flex;flex-direction:column;align-items:center;min-width:82px}
.hstat .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.hstat .val{font-family:var(--font-m);font-size:15px;font-weight:500}
#city-badge{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;font-family:var(--font-h);font-size:15px;font-weight:600}
#ap-bar{display:flex;gap:5px;align-items:center}
.ap-pip{width:13px;height:13px;border-radius:50%;background:var(--border);transition:background .2s}
.ap-pip.on{background:var(--drag);box-shadow:0 0 7px var(--drag)}
#wk-badge{font-family:var(--font-m);font-size:11px;color:var(--dim);background:var(--panel);border:1px solid var(--border);padding:4px 10px;border-radius:6px}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.rep-track{width:68px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.rep-fill{height:100%;background:linear-gradient(90deg,var(--info),var(--success));border-radius:3px;transition:width .4s}

/* LAYOUT */
#layout{display:flex;margin-top:var(--hdr);height:calc(100vh - var(--hdr) - var(--ticker))}
#sidebar{width:var(--nav);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 8px;gap:3px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:transparent;color:var(--dim);font-family:var(--font-h);font-size:15px;font-weight:600;letter-spacing:.5px;text-align:left;border:1px solid transparent;width:100%}
.nb:hover{background:var(--panel);color:var(--text);border-color:var(--border)}
.nb.active{background:var(--panel-h);color:var(--text);border-color:var(--border-h)}
.nb .ico{font-size:17px;width:20px;text-align:center}
.ndiv{height:1px;background:var(--border);margin:6px 0}
#etb{margin-top:auto;padding:11px;border-radius:8px;background:linear-gradient(135deg,#152515,#0f2a0f);color:var(--success);font-family:var(--font-h);font-size:15px;font-weight:700;letter-spacing:1px;border:1px solid var(--success);width:100%}
#etb:hover{background:var(--success);color:var(--bg);box-shadow:0 0 18px rgba(87,204,153,.3)}
#content{flex:1;overflow-y:auto;padding:20px}
.tp{display:none}.tp.active{display:block}

/* TICKER */
#ticker{position:fixed;bottom:0;left:0;right:0;height:var(--ticker);background:var(--surface);border-top:1px solid var(--border);overflow:hidden;display:flex;align-items:center}
.tkinner{display:flex;gap:48px;white-space:nowrap;animation:tscroll 50s linear infinite}
.tkinner:hover{animation-play-state:paused}
.tki{font-family:var(--font-m);font-size:11px;color:var(--dim);padding:0 8px}
.tki.up{color:var(--success)}.tki.dn{color:var(--danger)}.tki.ev{color:var(--warn)}
@keyframes tscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* PAGE */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.pt{font-family:var(--font-h);font-size:23px;font-weight:700;letter-spacing:1px}
.ps{font-size:12px;color:var(--dim);margin-top:2px}

/* CARDS */
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.ct{font-family:var(--font-h);font-size:15px;font-weight:700;letter-spacing:.5px;margin-bottom:12px}

/* MARKET */
.mc{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.fb{padding:5px 13px;border-radius:20px;background:var(--panel);color:var(--dim);border:1px solid var(--border);font-family:var(--font-h);font-size:12px;font-weight:600;cursor:pointer}
.fb:hover,.fb.a{color:var(--text);border-color:var(--border-h);background:var(--panel-h)}
.mtbl{width:100%;border-collapse:collapse}
.mtbl th{text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);border-bottom:1px solid var(--border);font-family:var(--font-h);font-weight:600}
.mtbl td{padding:7px 12px;border-bottom:1px solid rgba(37,37,64,.5)}
.mtbl tr:hover td{background:var(--panel-h)}
.pn{font-weight:600;font-size:13px}.pd{font-size:11px;color:var(--dim);margin-top:1px}
.cb{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-family:var(--font-h);font-weight:600;letter-spacing:.5px}
.ce{background:rgba(230,57,70,.15);color:var(--formula)}.cg{background:rgba(230,57,70,.1);color:#e88}
.ca{background:rgba(72,149,239,.15);color:var(--endurance)}.cs{background:rgba(87,204,153,.15);color:var(--rally)}
.cbr{background:rgba(255,149,0,.15);color:var(--touring)}.cel{background:rgba(255,214,10,.15);color:var(--drag)}
.cty{background:rgba(155,93,229,.15);color:var(--gt)}.cfu{background:rgba(200,200,200,.1);color:#aab}
.pc{font-family:var(--font-m);font-size:13px;font-weight:500}
.pu{color:var(--danger)}.pd2{color:var(--success)}.pn2{color:var(--text)}
.sn{font-family:var(--font-m);font-size:12px;color:var(--dim)}
.gtag{color:var(--warn);font-size:11px;font-weight:700}
.bbuy{padding:5px 13px;border-radius:6px;background:rgba(87,204,153,.15);color:var(--success);border:1px solid rgba(87,204,153,.3);font-family:var(--font-h);font-size:12px;font-weight:700}
.bbuy:hover{background:var(--success);color:var(--bg)}
.bdis{padding:5px 13px;border-radius:6px;background:var(--panel);color:var(--muted);border:1px solid var(--border);font-family:var(--font-h);font-size:12px;font-weight:700;cursor:not-allowed}

/* GARAGE / WAREHOUSE */
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px}
.sn2{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.sv{font-family:var(--font-m);font-size:25px;font-weight:500;margin:3px 0}
.sb{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:5px}
.sf{height:100%;border-radius:3px;transition:width .4s}
.fspd{background:linear-gradient(90deg,var(--info),var(--endurance))}.frel{background:linear-gradient(90deg,var(--success),#2ecc71)}.faero{background:linear-gradient(90deg,var(--gt),var(--info))}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px;transition:border-color .15s}
.pcard:hover{border-color:var(--border-h)}.pcard.gp{border-color:rgba(255,149,0,.4)}
.pct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.pcn{font-family:var(--font-h);font-size:14px;font-weight:700}
.cbar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin:6px 0}
.cfil{height:100%;border-radius:2px;transition:width .3s}
.cgood{background:var(--success)}.cok{background:var(--warn)}.cbad{background:var(--danger)}
.pst{display:flex;gap:10px;font-family:var(--font-m);font-size:11px;color:var(--dim);margin-bottom:8px}
.pacts{display:flex;gap:6px}
.bsm{padding:4px 11px;border-radius:5px;font-family:var(--font-h);font-size:11px;font-weight:700;letter-spacing:.5px;cursor:pointer;border:none}
.bins{background:rgba(72,149,239,.15);color:var(--info);border:1px solid rgba(72,149,239,.3)!important}.bins:hover{background:var(--info);color:#fff}
.buns{background:rgba(230,57,70,.15);color:var(--danger);border:1px solid rgba(230,57,70,.3)!important}.buns:hover{background:var(--danger);color:#fff}
.bssp{background:rgba(87,204,153,.1);color:var(--success);border:1px solid rgba(87,204,153,.25)!important}.bssp:hover{background:var(--success);color:var(--bg)}

/* FINANCE */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;margin-bottom:16px}
.fc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px}
.fl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.fv{font-family:var(--font-m);font-size:20px;font-weight:500}
.fv.pos{color:var(--success)}.fv.neg{color:var(--danger)}.fv.wrn{color:var(--warn)}
.lrow{display:flex;align-items:center;justify-content:space-between;padding:13px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.lname{font-family:var(--font-h);font-size:15px;font-weight:700;margin-bottom:2px}
.ldet{font-size:11px;color:var(--dim)}
.lbal{font-family:var(--font-m);font-size:17px;font-weight:500;margin:0 14px}
.lacts{display:flex;gap:6px}
.bbrw{padding:7px 14px;border-radius:7px;background:rgba(72,149,239,.15);color:var(--info);border:1px solid rgba(72,149,239,.3);font-family:var(--font-h);font-size:13px;font-weight:700;cursor:pointer}
.bbrw:hover{background:var(--info);color:#fff}
.consd{border-color:rgba(230,57,70,.6)!important;animation:pb 1.8s infinite}
@keyframes pb{0%,100%{border-color:rgba(230,57,70,.5)}50%{border-color:var(--danger)}}

/* RACE */
.rhdr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.rcp{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
.rlist{display:flex;flex-direction:column;gap:8px}
.rcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;align-items:center;gap:14px;transition:border-color .15s}
.rcard:hover{border-color:var(--border-h)}
.rdb{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.dfo{background:rgba(230,57,70,.2)}.den{background:rgba(72,149,239,.2)}.dra{background:rgba(87,204,153,.2)}
.dto{background:rgba(255,149,0,.2)}.ddr{background:rgba(255,214,10,.2)}.dgt{background:rgba(155,93,229,.2)}
.ri{flex:1}.rn{font-family:var(--font-h);font-size:16px;font-weight:700}
.rdt{font-size:11px;color:var(--dim);margin-top:2px}
.rp{font-family:var(--font-m);font-size:15px;color:var(--success);font-weight:500}
.benter{padding:8px 16px;border-radius:8px;background:linear-gradient(135deg,rgba(230,57,70,.2),rgba(255,149,0,.2));color:var(--text);border:1px solid rgba(230,57,70,.4);font-family:var(--font-h);font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer}
.benter:hover{background:linear-gradient(135deg,var(--formula),var(--warn));color:#fff;box-shadow:0 0 16px rgba(230,57,70,.3)}
.rhist{margin-top:16px}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(37,37,64,.5)}
.pb{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:13px;font-weight:700}
.p1{background:rgba(255,215,0,.2);color:var(--gold)}.p2{background:rgba(192,192,192,.2);color:var(--silver)}
.p3{background:rgba(205,127,50,.2);color:var(--bronze)}.pdnf{background:rgba(230,57,70,.15);color:var(--danger)}.poth{background:var(--panel);color:var(--dim)}

/* TRAVEL */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cityc{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px;cursor:pointer;transition:all .2s}
.cityc:hover{border-color:var(--border-h);transform:translateY(-2px)}
.cityc.cur{border-color:var(--success);background:rgba(87,204,153,.04);cursor:default}
.ctop{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cflag{font-size:24px}.cname{font-family:var(--font-h);font-size:15px;font-weight:700}.ccnt{font-size:10px;color:var(--dim)}
.cspec{font-size:11px;color:var(--dim);margin-bottom:8px;padding:3px 7px;background:var(--panel-h);border-radius:4px;display:inline-block}
.cprices{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.cpt{font-size:10px;padding:2px 6px;border-radius:4px}
.cheap{background:rgba(87,204,153,.1);color:var(--success)}.pricey{background:rgba(230,57,70,.1);color:var(--danger)}
.tcost{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border)}
.tfee{font-family:var(--font-m);font-size:11px;color:var(--warn)}
.btrv{padding:5px 12px;border-radius:6px;background:rgba(255,214,10,.1);color:var(--drag);border:1px solid rgba(255,214,10,.3);font-family:var(--font-h);font-size:11px;font-weight:700;cursor:pointer}
.btrv:hover{background:var(--drag);color:var(--bg)}

/* MODAL */
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;backdrop-filter:blur(4px);align-items:center;justify-content:center}
#mo.open{display:flex}
#mb{background:var(--panel);border:1px solid var(--border-h);border-radius:16px;padding:24px;min-width:340px;max-width:490px;width:90%;box-shadow:0 0 50px rgba(0,0,0,.8)}
.mtt{font-family:var(--font-h);font-size:21px;font-weight:700;margin-bottom:13px}
.mbd{margin-bottom:16px;color:var(--dim);line-height:1.65;font-size:13px}
.mbd strong{color:var(--text)}
.mac{display:flex;gap:8px;justify-content:flex-end}
.mi{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 13px;color:var(--text);font-size:16px;margin-bottom:11px}
.mi:focus{border-color:var(--info)}
.bcon{padding:8px 20px;border-radius:8px;background:var(--success);color:var(--bg);font-family:var(--font-h);font-size:14px;font-weight:700;cursor:pointer}
.bcan{padding:8px 20px;border-radius:8px;background:var(--panel-h);color:var(--dim);border:1px solid var(--border);font-family:var(--font-h);font-size:14px;font-weight:700;cursor:pointer}

/* TOAST */
#tc{position:fixed;top:66px;right:14px;z-index:300;display:flex;flex-direction:column;gap:7px}
.toast{padding:10px 15px;border-radius:9px;font-size:12px;font-weight:500;border:1px solid;animation:tin .3s ease;max-width:310px;line-height:1.4}
.ts{background:rgba(87,204,153,.1);border-color:var(--success);color:var(--success)}
.tw{background:rgba(255,149,0,.1);border-color:var(--warn);color:var(--warn)}
.td{background:rgba(230,57,70,.1);border-color:var(--danger);color:var(--danger)}
.ti{background:rgba(72,149,239,.1);border-color:var(--info);color:var(--info)}
@keyframes tin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}

/* MISC */
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.rs{text-align:center;padding:12px;background:var(--surface);border-radius:8px}
.rv{font-family:var(--font-m);font-size:23px;font-weight:500}
.rl{font-size:10px;color:var(--dim);margin-top:2px}
.empty{text-align:center;padding:34px;color:var(--dim)}
.eico{font-size:34px;margin-bottom:8px}
.sep{height:1px;background:var(--border);margin:16px 0}
.ib{padding:10px 14px;border-radius:8px;background:rgba(72,149,239,.07);border:1px solid rgba(72,149,239,.2);font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:13px}
.elog{max-height:240px;overflow-y:auto}
.lent{padding:6px 0;border-bottom:1px solid rgba(37,37,64,.5);font-size:12px;color:var(--dim)}
.lent .wt{font-family:var(--font-m);font-size:10px;color:var(--muted);margin-right:5px}
.lg{color:var(--success)}.lb{color:var(--danger)}.lev{color:var(--warn)}
</style>
</head>
<body>

<!-- HEADER -->
<header id="hdr">
  <div id="logo">PIT LANE<br>DEALER</div>
  <div class="hsep"></div>
  <div id="city-badge"><span id="hfl">🇵🇹</span><span id="hct">Portimão</span></div>
  <div class="hsep"></div>
  <div class="hstat"><span class="lbl">Cash</span><span class="val" id="hca" style="color:var(--success)">$10,000</span></div>
  <div class="hstat"><span class="lbl">Debt</span><span class="val" id="hdb" style="color:var(--danger)">$0</span></div>
  <div class="hstat"><span class="lbl">Net Worth</span><span class="val" id="hnw">$10,000</span></div>
  <div class="hsep"></div>
  <div id="ap-bar" title="Action Points this week">
    <span style="font-size:10px;color:var(--dim);margin-right:3px">AP</span>
    <div class="ap-pip on" id="ap0"></div><div class="ap-pip on" id="ap1"></div>
    <div class="ap-pip on" id="ap2"></div><div class="ap-pip on" id="ap3"></div><div class="ap-pip on" id="ap4"></div>
  </div>
  <div id="wk-badge">Wk<span id="hwk">1</span> S<span id="hss">1</span></div>
  <div class="hright">
    <span style="font-size:10px;color:var(--dim)">REP</span>
    <div class="rep-track"><div class="rep-fill" id="hrp" style="width:50%"></div></div>
    <span style="font-family:var(--font-m);font-size:11px;color:var(--dim)" id="hrv">50</span>
  </div>
</header>

<!-- LAYOUT -->
<div id="layout">
  <nav id="sidebar">
    <button class="nb active" data-tab="market"><span class="ico">📈</span>Market</button>
    <button class="nb" data-tab="garage"><span class="ico">🏎️</span>Garage</button>
    <button class="nb" data-tab="warehouse"><span class="ico">📦</span>Warehouse</button>
    <button class="nb" data-tab="finance"><span class="ico">💰</span>Finance</button>
    <button class="nb" data-tab="race"><span class="ico">🏁</span>Race</button>
    <button class="nb" data-tab="travel"><span class="ico">🗺️</span>Travel</button>
    <div class="ndiv"></div>
    <button id="etb">⏩ END WEEK</button>
  </nav>
  <main id="content">
    <div id="tab-market" class="tp active"></div>
    <div id="tab-garage" class="tp"></div>
    <div id="tab-warehouse" class="tp"></div>
    <div id="tab-finance" class="tp"></div>
    <div id="tab-race" class="tp"></div>
    <div id="tab-travel" class="tp"></div>
  </main>
</div>
<div id="ticker"><div class="tkinner" id="tki"></div></div>
<div id="mo"><div id="mb"><div class="mtt" id="mtt"></div><div class="mbd" id="mbd"></div><div class="mac" id="mac"></div></div></div>
<div id="tc"></div>

<script>
// ══════════ DATA ══════════
const PARTS={
  formula_engine:{id:'formula_engine',name:'Formula Engine',cat:'engine',e:'⚙️',base:85000,sl:4,spd:28,rel:15,aero:0,grey:false,desc:'High-revving naturally aspirated formula unit'},

function uid(){return G.nuid++}
function cpk(c,p){return c+'|'+p}

// ══════════ MARKET ENGINE ══════════
function initPrices(){
  Object.keys(CITIES).forEach(cid=>{
    Object.keys(PARTS).forEach(pid=>{
      const p=PARTS[pid],city=CITIES[cid];
      G.prices[cpk(cid,pid)]=Math.round(p.base*(city.mul[p.cat]||1));
    });
  });
}

function getPrice(cid,pid){
  let price=G.prices[cpk(cid,pid)]||PARTS[pid].base;
  G.events.forEach(ev=>{
    if(ev.catId&&ev.catId===PARTS[pid].cat)price=Math.round(price*(ev.catMul||1));
    if(ev.cityId&&ev.cityId===cid)price=Math.round(price*(ev.cityMul||1));
  });
  return Math.max(50,price);
}

function getSell(cid,pid,cond){
  return Math.round(getPrice(cid,pid)*0.82*(0.5+(cond/100)*0.5));
}

function updatePrices(){
  Object.keys(CITIES).forEach(cid=>{
    Object.keys(PARTS).forEach(pid=>{
      const k=cpk(cid,pid),p=PARTS[pid],city=CITIES[cid];
      const base=p.base*(city.mul[p.cat]||1);
      const drift=1+(Math.random()-0.5)*0.22;
      let np=Math.round((G.prices[k]||base)*drift);
      np=Math.max(Math.round(base*0.55),Math.min(Math.round(base*1.9),np));
      G.prices[k]=np;
    });
  });
}

function fireEvent(){
  const t=EVT_TEMPLATES[Math.floor(Math.random()*EVT_TEMPLATES.length)];
  if(Math.random()>t.prob*4)return;
  const cats=Object.keys(CITIES[G.city].mul);
  const cat=cats[Math.floor(Math.random()*cats.length)];
  const cids=Object.keys(CITIES);
  const cid=cids[Math.floor(Math.random()*cids.length)];
  const ev={
    id:uid(),
    msg:t.msg.replace('{cat}',cat).replace('{city}',CITIES[cid].n),
    catId:t.catMul?cat:null,catMul:t.catMul||1,
    cityId:t.cityMul?cid:null,cityMul:t.cityMul||1,
    greyRisk:!!t.greyRisk,dur:t.dur||2
  };
  G.events.push(ev);
  addLog('⚡ EVENT: '+ev.msg,'ev');
  toast(ev.msg,'w');
}

// ══════════ CAR STATS ══════════
function carStats(){
  let s=0,r=50,a=0;
  G.inst.forEach(it=>{const p=PARTS[it.pid],cf=it.cond/100;s+=p.spd*cf;r+=p.rel*cf;a+=p.aero*cf;});
  return{spd:Math.round(s),rel:Math.min(95,Math.round(r)),aero:Math.round(a)};
}

// ══════════ ACTIONS ══════════
function spendAP(n=1){if(G.ap<n){toast('Not enough Action Points!','d');return false;}G.ap-=n;return true;}
function wusd(){return G.wh.reduce((s,i)=>s+(PARTS[i.pid].sl||1),0)}
function wcap(){return 40}
function wval(){return G.wh.reduce((s,i)=>s+getSell(G.city,i.pid,i.cond),0)}
function tdebt(){return G.loans.bank+G.loans.angel+G.loans.consortium}
function fmt(n){return '$'+Math.abs(Math.round(n)).toLocaleString()}
function condC(c){return c>=70?'cgood':c>=40?'cok':'cbad'}
function condL(c){return c>=70?'Good':c>=40?'Fair':c>0?'Worn':'Destroyed'}
function discD(d){return{formula:'dfo',endurance:'den',rally:'dra',touring:'dto',drag:'ddr',gt:'dgt',all:'dfo'}[d]||'dfo'}
function discE(d){return{formula:'🔴',endurance:'🔵',rally:'🌿',touring:'🟠',drag:'🟡',gt:'🟣',all:'⚫'}[d]||'⚪'}
function catC(c){return{engine:'ce',gearbox:'cg',aero:'ca',suspension:'cs',brakes:'cbr',electronics:'cel',tyres:'cty',fuel:'cfu'}[c]||'ce'}

function buyPart(pid,qty){
  const p=PARTS[pid];
  if(p.grey&&!G.greyOk){toast('Grey market locked — win a race first!','d');return;}
  const price=getPrice(G.city,pid),total=price*qty;
  if(G.cash<total){toast('Not enough cash!','d');return;}
  if(wusd()+p.sl*qty>wcap()){toast('Warehouse full!','d');return;}
  G.cash-=total;
  for(let i=0;i<qty;i++)G.wh.push({uid:uid(),pid,cond:100,bp:price,bc:G.city,bw:G.week});
  addLog('Bought '+qty+'x '+p.name+' @ '+fmt(price)+' in '+CITIES[G.city].n,'g');
  toast('Bought '+qty+'x '+p.name+' for '+fmt(total),'s');
  render();
}

function sellWh(iuid){
  const idx=G.wh.findIndex(i=>i.uid===iuid);if(idx<0)return;
  const it=G.wh[idx],p=PARTS[it.pid];
  const sp=getSell(G.city,it.pid,it.cond);
  G.cash+=sp;G.wh.splice(idx,1);
  const pl=sp-it.bp;
  addLog('Sold '+p.name+' for '+fmt(sp)+' (P&L:'+(pl>=0?'+':'')+fmt(pl)+')','g');
  toast('Sold for '+fmt(sp)+' · P&L:'+(pl>=0?'+':'')+fmt(pl),'s');
  render();
}

function installPart(iuid){
  const idx=G.wh.findIndex(i=>i.uid===iuid);if(idx<0)return;
  const it=G.wh[idx];
  if(G.inst.find(i=>i.pid===it.pid)){toast('Part type already installed — uninstall first','d');return;}
  G.wh.splice(idx,1);
  G.inst.push({uid:it.uid,pid:it.pid,cond:it.cond,iw:G.week});
  toast('Installed '+PARTS[it.pid].name,'s');render();
}

function uninstall(iuid){
  const idx=G.inst.findIndex(i=>i.uid===iuid);if(idx<0)return;
  const it=G.inst[idx];G.inst.splice(idx,1);
  G.wh.push({uid:it.uid,pid:it.pid,cond:it.cond,bp:0,bc:'',bw:G.week});
  toast('Uninstalled '+PARTS[it.pid].name,'i');render();
}

function travelTo(cid){
  if(cid===G.city){toast('Already here!','i');return;}
  if(!spendAP(1))return;
  const fee=CITIES[cid].tc;
  if(G.cash<fee){G.ap++;toast('Need '+fmt(fee)+' to travel!','d');return;}
  G.cash-=fee;addLog('Travelled to '+CITIES[cid].n+' — cost '+fmt(fee),'');
  G.city=cid;toast('Arrived in '+CITIES[cid].n+' '+CITIES[cid].f,'s');render();
}

function enterRace(race){
  if(!spendAP(1))return;
  const st=carStats();
  if(Math.random()>(st.rel/100)){
    wearParts(40);addLog('DNF in '+race.n+' — mechanical failure!','b');
    showRaceResult(race,{pos:'DNF',prize:0,pts:0});render();return;
  }
  const ps=st.spd+st.aero*0.4+(Math.random()-0.5)*30;
  const rs=race.rival+(Math.random()-0.5)*28;
  const diff=ps-rs;
  let pos;
  if(diff>18)pos=1;else if(diff>8)pos=2;else if(diff>0)pos=3;
  else if(diff>-10)pos=4;else if(diff>-20)pos=6;else pos=10;
  const prize=race.prize[Math.min(pos-1,race.prize.length-1)]||0;
  const pts=[25,18,15,12,10,8,6,4,2,1][pos-1]||1;
  G.cash+=prize;G.champ.pts+=pts;
  if(pos===1){G.champ.wins++;if(!G.greyOk){G.greyOk=true;toast('🔓 Grey Market Unlocked — you won your first race!','w',5000);}}
  G.rep=Math.min(100,G.rep+(pos<=3?8:pos<=6?3:-2));
  wearParts(pos<=3?12:pos<=6?18:25);
  G.raceHist.unshift({wk:G.week,n:race.n,d:race.disc,pos,prize,pts});
  if(G.raceHist.length>12)G.raceHist.pop();
  addLog('P'+pos+' in '+race.n+' · Prize: '+fmt(prize),'g');
  showRaceResult(race,{pos,prize,pts});render();
}

function wearParts(amt){
  G.inst.forEach(it=>{it.cond=Math.max(0,Math.round(it.cond-(amt+(Math.random()-0.5)*10)));});
  const dead=G.inst.filter(i=>i.cond===0);
  dead.forEach(i=>{G.inst.splice(G.inst.indexOf(i),1);addLog(PARTS[i.pid].name+' destroyed!','b');});
}

function takeLoan(lid,amt){
  if(!spendAP(1))return;amt=Math.round(amt);
  const info=LENDERS[lid];
  if(lid!=='consortium'&&G.loans[lid]+amt>info.limit){G.ap++;toast('Exceeds '+info.name+' limit!','d');return;}
  G.cash+=amt;G.loans[lid]+=amt;
  addLog('Borrowed '+fmt(amt)+' from '+info.name,'');toast('Received '+fmt(amt),'i');render();
}

function repayLoan(lid,amt){
  amt=Math.min(Math.round(amt),G.loans[lid]);
  if(amt<=0||G.cash<amt){toast('Not enough cash!','d');return;}
  G.cash-=amt;G.loans[lid]-=amt;
  addLog('Repaid '+fmt(amt)+' to '+LENDERS[lid].name,'g');toast('Repaid '+fmt(amt),'s');render();
}

function endWeek(){
  // interest
  Object.keys(LENDERS).forEach(l=>{if(G.loans[l]>0)G.loans[l]+=Math.round(G.loans[l]*LENDERS[l].rate);});
  G.cash-=G.wkBase;
  // consortium check
  if(G.loans.consortium>0&&G.cash<0){
    G.consMiss++;addLog('⚠ Missed Consortium payment!','b');toast('⚠ Missed Consortium payment!','d');
    if(G.consMiss>=2){
      G.consMiss=0;const n=Math.ceil(G.wh.length*0.35);G.wh.splice(0,n);
      toast('🚨 CONSORTIUM RAID — '+n+' parts seized!','d',6000);addLog('🚨 CONSORTIUM RAID — '+n+' parts seized!','b');
    }
  }else{G.consMiss=0;}
  // bankruptcy
  if(G.cash+wval()-tdebt()<-80000){
    openModal('💀 Bankruptcy','<p>Your debts have overwhelmed you. The creditors have taken everything.</p><p style="margin-top:10px">Reload to start again.</p>',[{l:'Restart',fn:()=>location.reload(),c:'bcon'}]);return;
  }
  updatePrices();
  G.events=G.events.filter(e=>{e.dur--;return e.dur>0;});
  if(Math.random()<0.3)fireEvent();
  G.ap=5;G.week++;
  if(G.week>30){G.week=1;G.season++;G.champ={pts:0,wins:G.champ.wins};}
  addLog('--- Week '+G.week+' begins · Ops: '+fmt(G.wkBase)+' ---','');
  render();
}

      <div class="rcp"><div class="ct" style="margin-bottom:10px">Season ${G.season} Stats</div>
        <div style="display:flex;gap:16px;font-family:var(--font-m)">
          <div><div style="font-size:9px;color:var(--dim)">POINTS</div><div style="font-size:24px;color:var(--drag)">${G.champ.pts}</div></div>
          <div><div style="font-size:9px;color:var(--dim)">WINS</div><div style="font-size:24px;color:var(--gold)">${G.champ.wins}</div></div>
          <div><div style="font-size:9px;color:var(--dim)">RACES</div><div style="font-size:24px">${G.raceHist.length}</div></div>
          <div><div style="font-size:9px;color:var(--dim)">REP</div><div style="font-size:24px;color:var(--info)">${G.rep}</div></div>
        </div>
      </div>
    </div>
    <div class="ct">Available Races in ${city.n}</div>
    ${races.length===0?`<div class="empty"><div class="eico">🏁</div>No races here. Travel to a race venue to compete.</div>`:''}
    <div class="rlist">${races.map(race=>{
      const sc=st.spd+st.aero*0.4,diff=Math.round(sc-race.rival);
      const ac=diff>10?'var(--success)':diff>-10?'var(--warn)':'var(--danger)';
      const al=diff>15?'STRONG FAV':diff>0?'SLIGHT FAV':diff>-15?'EVEN MATCH':'UNDERDOG';
      return`<div class="rcard">
        <div class="rdb ${discD(race.disc)}">${discE(race.disc)}</div>
        <div class="ri"><div class="rn">${race.n}</div>
          <div class="rdt">${race.desc} · Rivals: <span style="color:${race.rival>70?'var(--danger)':race.rival>50?'var(--warn)':'var(--success)'}">${race.rival}/100</span></div>
          <div style="font-size:11px;margin-top:3px">vs field: <span style="color:${ac};font-weight:700">${al}</span></div>
        </div>
        <div style="text-align:right">
          <div class="rp">${fmt(race.prize[0])} <span style="font-size:10px;color:var(--dim)">1st</span></div>
          <div style="font-size:10px;color:var(--dim);margin-top:2px">1 AP cost</div>
          <button class="benter" style="margin-top:7px" onclick="enterRaceById('${race.id}','${G.city}')">ENTER RACE</button>
        </div>
      </div>`;
    }).join('')}</div>
    ${G.raceHist.length>0?`<div class="sep"></div><div class="ct">Recent Results</div>
    <div class="rhist">${G.raceHist.slice(0,8).map(r=>{
      const pc=r.pos===1?'p1':r.pos===2?'p2':r.pos===3?'p3':r.pos==='DNF'?'pdnf':'poth';
      return`<div class="hrow"><div class="pb ${pc}">${r.pos==='DNF'?'✗':r.pos}</div>
        <div style="flex:1"><div style="font-size:12px;font-weight:600">${r.n}</div><div style="font-size:10px;color:var(--dim)">Week ${r.wk}</div></div>
        <div style="font-family:var(--font-m);color:var(--success);font-size:12px">${r.prize>0?fmt(r.prize):'—'}</div>
        <div style="font-family:var(--font-m);color:var(--drag);font-size:12px;width:50px;text-align:right">+${r.pts}pts</div>
      </div>`;
    }).join('')}</div>`:''}`;
}

function renderTravel(){
  document.getElementById('tab-travel').innerHTML=`
    <div class="ph"><div><div class="pt">🗺️ World Map — 16 Hub Cities</div><div class="ps">1 AP + travel fee per journey · Currently in: <strong>${CITIES[G.city].n}</strong></div></div></div>
    <div class="ib">💡 <strong>Arbitrage:</strong> Buy where parts are <strong style="color:var(--success)">cheap</strong> (shown as ✓), travel to cities where the same parts are <strong style="color:var(--danger)">expensive</strong>, sell for profit. The spread pays the airfare.</div>
    <div class="cgrid">${Object.values(CITIES).map(c=>{
      const isCur=c.id===G.city;
      const cheapCats=Object.entries(c.mul).sort((a,b)=>a[1]-b[1]).slice(0,2);
      const expCat=Object.entries(c.mul).sort((a,b)=>b[1]-a[1]).slice(0,1);
      return`<div class="cityc${isCur?' cur':''}" ${!isCur?`onclick="travelTo('${c.id}')"`:''}">
        <div class="ctop"><div class="cflag">${c.f}</div><div><div class="cname">${c.n}${isCur?' ✓':''}</div><div class="ccnt">${c.co}</div></div></div>
        <div class="cspec">${discE(c.disc)} ${c.spec}</div>
        <div class="cprices">
          ${cheapCats.map(([cat,mul])=>`<span class="cpt cheap">✓ ${cat} ${Math.round((1-mul)*100)}% off</span>`).join('')}
          ${expCat.map(([cat,mul])=>`<span class="cpt pricey">✗ ${cat} +${Math.round((mul-1)*100)}%</span>`).join('')}
        </div>
        ${c.grey&&G.greyOk?'<div style="font-size:10px;color:var(--warn);margin-top:4px">⚠ Grey market available</div>':''}
        <div class="tcost">
          ${isCur?`<span style="color:var(--success);font-size:11px">📍 Current location</span>`:`<span class="tfee">✈ ${fmt(c.tc)} · 1 AP</span><button class="btrv" onclick="event.stopPropagation();travelTo('${c.id}')">GO</button>`}
        </div>
      </div>`;
    }).join('')}</div>`;
}

function renderTicker(){
  const its=[];
  Object.values(PARTS).filter(p=>!p.grey).slice(0,5).forEach(p=>{
    const price=getPrice(G.city,p.id),base=p.base*(CITIES[G.city].mul[p.cat]||1),diff=price-base,dp=Math.round((diff/base)*100);
    its.push(`<span class="tki ${diff>0?'dn':'up'}">${CITIES[G.city].f} ${p.name}: ${fmt(price)} ${diff>=0?'▲':'▼'}${Math.abs(dp)}%</span>`);
  });
  G.events.forEach(ev=>its.push(`<span class="tki ev">⚡ ${ev.msg}</span>`));
  if(G.raceHist.length>0){const l=G.raceHist[0];its.push(`<span class="tki">🏁 Last: ${l.n} — P${l.pos} ${fmt(l.prize)}</span>`);}
  if(G.cash<0)its.push(`<span class="tki" style="color:var(--danger)">⚠ CASH NEGATIVE — pay debts!</span>`);
  if(G.greyOk)its.push(`<span class="tki" style="color:var(--warn)">🔓 Grey market unlocked</span>`);
  const dbl=[...its,...its];
  document.getElementById('tki').innerHTML=dbl.join('');
}

function enterRaceById(rid,cid){const races=RACES[cid]||[];const race=races.find(r=>r.id===rid);if(race)enterRace(race);}

function render(){
  renderHeader();renderTicker();
  if(G.tab==='market')renderMarket();
  else if(G.tab==='garage')renderGarage();
  else if(G.tab==='warehouse')renderWarehouse();
  else if(G.tab==='finance')renderFinance();
  else if(G.tab==='race')renderRace();
  else if(G.tab==='travel')renderTravel();
}

// ══════════ EVENT LISTENERS ══════════
document.querySelectorAll('.nb').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tp').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');G.tab=btn.dataset.tab;
    document.getElementById('tab-'+G.tab).classList.add('active');render();
  });
});

document.getElementById('etb').addEventListener('click',()=>{
  const wkI=Object.keys(LENDERS).reduce((s,l)=>s+Math.round(G.loans[l]*LENDERS[l].rate),0);
  openModal('⏩ End Week '+G.week,`<div style="line-height:1.8">Weekly deductions:<br>• Base ops: <strong>${fmt(G.wkBase)}</strong><br>• Loan interest: <strong>${fmt(wkI)}</strong><br><br>Markets update. Events may trigger.<br>You gain <strong>5 fresh Action Points</strong>.</div>`,[{l:'End Week',fn:endWeek,c:'bcon'}]);
});

document.getElementById('mo').addEventListener('click',e=>{if(e.target===document.getElementById('mo'))closeModal();});

toast('Welcome! $10,000 cash · Portimão · 2 worn parts on car · Race available! 🏎️','i',6000);
render();
</script>
